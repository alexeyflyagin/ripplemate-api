<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f2f2;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f2f2;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:400px; background-color:#ffffff; border-radius:20px; overflow:hidden;">
          <tr>
            <td style="padding:40px 32px; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
              <h1 style="margin:0 0 8px 0; font-size:22px; line-height:28px; font-weight:600; color:#1d211d;">Confirm your email</h1>
              <p style="margin:0 0 32px 0; font-size:15px; line-height:22px; color:#5a665a;">
                Welcome to RippleMate. Tap the button below to confirm your email address. This link is valid for {{ttl}} hours.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 32px 0;">
                <tr>
                  <td style="border-radius:16px; background-color:#196f50;">
                    <a href="{{link}}" target="_blank" style="display:inline-block; padding:12px 24px; font-family:'Inter',-apple-system,sans-serif; font-size:15px; font-weight:600; color:#f2f2f2; text-decoration:none; border-radius:16px;">
                      Confirm email
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0; font-size:13px; line-height:20px; color:#747474;">
                If you didn't create a RippleMate account, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0 0; font-family:'Inter',-apple-system,sans-serif; font-size:12px; line-height:18px; color:#747474;">RippleMate</p>
      </td>
    </tr>
  </table>
</body>
</html>
